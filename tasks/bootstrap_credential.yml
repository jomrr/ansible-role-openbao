---
# role: openbao
# file: tasks/bootstrap_credential.yml

- name: OPENBAO | Encrypt the bootstrap Secret ID as systemd credential
  become: true
  become_user: root
  ansible.builtin.command:
    argv:
      - systemd-creds
      - encrypt
      - "--name={{ __openbao_bootstrap_credential_name }}"
      - "--with-key={{ openbao_seal_credential_key }}"
      - --tpm2-pcrs=
      - "-"
      - "{{ __openbao_bootstrap_credential_file }}"
    stdin: "{{ openbao_bootstrap_secret_id }}"
    stdin_add_newline: false
    creates: "{{ __openbao_bootstrap_credential_file }}"
  no_log: true
  notify: restart

- name: OPENBAO | Restrict the bootstrap credential
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __openbao_bootstrap_credential_file }}"
    state: file
    owner: root
    group: root
    mode: "0600"

- name: OPENBAO | Remove the bootstrap credential of the unused key binding
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __openbao_bootstrap_unused_credential }}"
    state: absent
  loop: "{{ __openbao_bootstrap_credential_files.values() | reject('eq', __openbao_bootstrap_credential_file) }}"
  loop_control:
    loop_var: __openbao_bootstrap_unused_credential
