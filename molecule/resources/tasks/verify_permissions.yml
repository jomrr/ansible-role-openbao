---
# role: openbao
# file: molecule/resources/tasks/verify_permissions.yml

- name: OPENBAO | Verify management KV and snapshot permissions from the controller
  delegate_to: localhost
  module_defaults:
    ansible.builtin.uri:
      ca_path: "{{ openbao_controller_ca_file }}"
      use_netrc: false
      follow_redirects: none
      body_format: json
      headers:
        X-Vault-Token: "{{ __openbao_test_login.json.auth.client_token }}"
  block:
    - name: OPENBAO | Read effective permissions for data metadata and snapshots
      ansible.builtin.uri:
        url: "{{ openbao_api_addr }}/v1/sys/capabilities-self"
        method: POST
        body:
          paths: [molecule/data/example, molecule/metadata/example, sys/storage/raft/snapshot]
      register: __openbao_test_capabilities
      no_log: true

    - name: OPENBAO | Assert the requested management capabilities
      ansible.builtin.assert:
        that:
          - __openbao_test_capabilities.json.data['molecule/data/example'] | sort == ['create', 'delete', 'list', 'read', 'update']
          - __openbao_test_capabilities.json.data['molecule/metadata/example'] | sort == ['create', 'delete', 'list', 'read', 'update']
          - __openbao_test_capabilities.json.data['sys/storage/raft/snapshot'] == ['read']
        quiet: true

    - name: OPENBAO | Mount a temporary KV v2 engine
      ansible.builtin.uri:
        url: "{{ openbao_api_addr }}/v1/sys/mounts/molecule"
        method: POST
        body:
          type: kv
          options:
            version: '2'
        status_code: 204
      no_log: true

    - name: OPENBAO | Exercise KV operations and clean up the temporary mount
      block:
        - name: OPENBAO | Create and update a KV secret
          ansible.builtin.uri:
            url: "{{ openbao_api_addr }}/v1/molecule/data/example"
            method: POST
            body:
              data:
                value: "{{ __openbao_test_value }}"
          loop: [first, second]
          loop_control:
            loop_var: __openbao_test_value
          no_log: true

        - name: OPENBAO | Read the updated KV secret
          ansible.builtin.uri:
            url: "{{ openbao_api_addr }}/v1/molecule/data/example"
          register: __openbao_test_secret
          no_log: true

        - name: OPENBAO | List KV metadata
          ansible.builtin.uri:
            url: "{{ openbao_api_addr }}/v1/molecule/metadata?list=true"
          register: __openbao_test_keys
          no_log: true

        - name: OPENBAO | Assert the secret was updated and listed
          ansible.builtin.assert:
            that:
              - __openbao_test_secret.json.data.data.value == 'second'
              - "'example' in __openbao_test_keys.json.data['keys']"
            quiet: true
          no_log: true

        - name: OPENBAO | Delete the secret data and metadata
          ansible.builtin.uri:
            url: "{{ openbao_api_addr }}/v1/molecule/{{ __openbao_test_kv_path }}/example"
            method: DELETE
            status_code: 204
          loop: [data, metadata]
          loop_control:
            loop_var: __openbao_test_kv_path
          no_log: true

        - name: OPENBAO | Confirm metadata deletion
          ansible.builtin.uri:
            url: "{{ openbao_api_addr }}/v1/molecule/metadata/example"
            status_code: 404
          no_log: true
      always:
        - name: OPENBAO | Remove the temporary KV engine
          ansible.builtin.uri:
            url: "{{ openbao_api_addr }}/v1/sys/mounts/molecule"
            method: DELETE
            status_code: 204
          no_log: true

    - name: OPENBAO | Download a raft snapshot using management access
      ansible.builtin.uri:
        url: "{{ openbao_api_addr }}/v1/sys/storage/raft/snapshot"
        dest: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/{{ inventory_hostname }}.snap"
        mode: '0600'
      no_log: true
