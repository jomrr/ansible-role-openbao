---
# role: openbao
# file: molecule/resources/playbooks/verify.yml

- name: "OPENBAO | Verify automatic unsealing"
  hosts: all
  gather_facts: false
  tasks:
    - name: "OPENBAO | Wait until the restarted server is unsealed"
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/health
        ca_path: /etc/pki/molecule/openbao.crt
      register: __openbao_health
      until: __openbao_health.status == 200
      retries: 20
      delay: 3

    - name: "OPENBAO | Read the seal status"
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/seal-status
        ca_path: /etc/pki/molecule/openbao.crt
      register: __openbao_seal_status

    - name: "OPENBAO | Assert the static seal unsealed the raft storage"
      ansible.builtin.assert:
        that:
          - __openbao_seal_status.json.type == 'static'
          - __openbao_seal_status.json.storage_type == 'raft'
          - __openbao_seal_status.json.initialized
          - not __openbao_seal_status.json.sealed
        quiet: true

    - name: "OPENBAO | Collect service states"
      ansible.builtin.service_facts:

    - name: "OPENBAO | Assert the service is enabled and running"
      ansible.builtin.assert:
        that:
          - ansible_facts.services['openbao.service'].status == 'enabled'
          - ansible_facts.services['openbao.service'].state == 'running'
        quiet: true

    - name: "OPENBAO | Read the seal key credential"
      become: true
      become_user: root
      ansible.builtin.slurp:
        src: /etc/credstore.encrypted/openbao-seal-key.host.cred
      register: __openbao_credential
      no_log: true

    - name: "OPENBAO | Assert the seal key is not stored in plain text"
      ansible.builtin.assert:
        that:
          - openbao_seal_key not in (__openbao_credential.content | b64decode)
        quiet: true
      no_log: true

    - name: "OPENBAO | Verify bootstrap management access and declarative audit"
      when: openbao_bootstrap_enabled
      block:
        - name: "OPENBAO | Authenticate using the bootstrapped AppRole"
          delegate_to: localhost
          ansible.builtin.uri:
            url: "{{ openbao_api_addr }}/v1/auth/ansible/login"
            method: POST
            body_format: json
            body:
              role_id: "{{ openbao_bootstrap_role_id }}"
              secret_id: "{{ openbao_bootstrap_secret_id }}"
            ca_path: "{{ openbao_controller_ca_file }}"
          register: __openbao_test_login
          no_log: true

        - name: "OPENBAO | Read configured audit devices"
          delegate_to: localhost
          ansible.builtin.uri:
            url: "{{ openbao_api_addr }}/v1/sys/audit"
            ca_path: "{{ openbao_controller_ca_file }}"
            headers:
              X-Vault-Token: "{{ __openbao_test_login.json.auth.client_token }}"
          register: __openbao_test_audit
          no_log: true

        - name: "OPENBAO | Assert the management policy and file audit device"
          ansible.builtin.assert:
            that:
              - "'ansible-admin' in __openbao_test_login.json.auth.policies"
              - "'root' not in __openbao_test_login.json.auth.policies"
              - __openbao_test_audit.json.data['file/'].options.file_path == '/var/log/openbao/audit.json'
            quiet: true

        - name: "OPENBAO | Exercise management data and snapshot permissions"
          ansible.builtin.include_tasks: ../tasks/verify_permissions.yml

        - name: "OPENBAO | Revoke the test session"
          delegate_to: localhost
          ansible.builtin.uri:
            url: "{{ openbao_api_addr }}/v1/auth/token/revoke-self"
            ca_path: "{{ openbao_controller_ca_file }}"
            method: POST
            headers:
              X-Vault-Token: "{{ __openbao_test_login.json.auth.client_token }}"
            status_code: 204
          no_log: true

        - name: "OPENBAO | Read the audit log"
          become: true
          become_user: root
          ansible.builtin.slurp:
            src: /var/log/openbao/audit.json
          register: __openbao_test_audit_log
          no_log: true

        - name: "OPENBAO | Assert bootstrap root revocation was audited without the Secret ID"
          ansible.builtin.assert:
            that:
              - >-
                (__openbao_test_audit_log.content | b64decode).splitlines() | reject('equalto', '')
                | map('from_json') | selectattr('type', 'equalto', 'request')
                | selectattr('request.path', 'equalto', 'auth/token/revoke-self')
                | selectattr('auth.policies', 'defined')
                | selectattr('auth.policies', 'contains', 'root') | list | length == 1
              - openbao_bootstrap_secret_id not in (__openbao_test_audit_log.content | b64decode)
            quiet: true
          no_log: true
